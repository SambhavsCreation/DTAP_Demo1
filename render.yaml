services:
  - type: web
    name: planty-patootie
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --no-input && gunicorn plant_monitor.wsgi --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --worker-class gthread --threads ${GUNICORN_THREADS:-4} --timeout ${GUNICORN_TIMEOUT:-120} --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT:-30} --keep-alive 5
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      - key: OPENROUTER_PROVIDER_SORT
        value: throughput
      - key: PLANT_TTS_LANGUAGE
        value: en
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
